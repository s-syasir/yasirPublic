services:
  mc:
    image: itzg/minecraft-server
    environment:
      EULA: "true"
      MEMORY: "2G"
      TIMEOUT: "120"
    ports:
      - "<TAILNET_IP>:25565:25565"
    volumes:
      - <VOLUME>
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mc-server.rule=Host(`mc-server.<HOST>.example.org`) || Host(`mc-server.<HOST>.example.org`)"
      - "traefik.http.routers.mc-server.entrypoints=websecure"
      - "traefik.http.routers.mc-server.tls=true"
      - "traefik.http.services.mc-server.loadbalancer.server.port=25565"

networks:
  proxy:
    external: true
