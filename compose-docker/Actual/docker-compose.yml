services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
#    ports:
#      - '127.0.0.1:5006:5006'
    environment:
      - ACTUAL_OPENID_AUTH_METHOD=openid
      - ACTUAL_LOGIN_METHOD=openid
      - ACTUAL_ALLOWED_LOGIN_METHODS=openid,password,header
      - ACTUAL_OPENID_ENFORCE=false
      # Uncomment any of the lines below to set configuration options.
      # - ACTUAL_HTTPS_KEY=/data/selfhost.key
      # - ACTUAL_HTTPS_CERT=/data/selfhost.crt
      # - ACTUAL_PORT=5006
      # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      # See all options and more details at https://actualbudget.org/docs/config/
      # !! If you are not using any of these options, remove the 'environment:' tag entirely.
    volumes:
      # Change './actual-data' below to the path to the folder you want Actual to store its data in on your server.
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - <VOLUME>
    healthcheck:
      # Enable health check for the instance
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actual-budget.rule=Host(`actual-budget.<HOST>.example.org`) || Host(`actual-budget.<HOST>.example.org`)"
      - "traefik.http.routers.actual-budget.entrypoints=websecure"
      - "traefik.http.routers.actual-budget.tls=true"
      - "traefik.http.services.actual-budget.loadbalancer.server.port=5006"
    networks:
      - proxy


  actual-auto-sync:
    image: seriouslag/actual-auto-sync:latest
    environment:
      - ACTUAL_SERVER_URL=https://actual-budget.<HOST>.example.org
      - ACTUAL_SERVER_PASSWORD=<REDACTED>
      - CRON_SCHEDULE=0 7 * * *
      - LOG_LEVEL=info
      - ACTUAL_BUDGET_SYNC_IDS=<REDACTED_UUID>
      - ENCRYPTION_PASSWORDS=
      - TIMEZONE=America/Los_Angeles
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
