services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - INFO=1
    ports:
      # Bound to localhost deliberately. Docker publishes ports by inserting its own
      # iptables rules AHEAD of UFW's chain, so "2375:2375" is reachable from the whole
      # network no matter what `ufw status` claims - verified 2026-08-06 by reaching it
      # off-host from babyboi while UFW showed default-deny. Exposing the Docker API,
      # even read-scoped, is not something to leave open by accident.
      # Anything needing it should reach it over the compose network, not the host IP.
      - "127.0.0.1:2375:2375"
