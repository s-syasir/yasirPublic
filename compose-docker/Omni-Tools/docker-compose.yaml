services:
  omni-tools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.omni-tools.rule=Host(`omni-tools.<HOST>.example.org`) || Host(`omni-tools.<HOST>.example.org`)"
      - "traefik.http.routers.omni-tools.entrypoints=websecure"
      - "traefik.http.routers.omni-tools.tls=true"
      - "traefik.http.services.omni-tools.loadbalancer.server.port=80"
#    ports:
#      - "127.0.0.1:8081:80"
    networks:
      - proxy

networks:
  proxy:
    external: true
