  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - <VOLUME>
      # - <VOLUME>
      - "<NAS_MOUNT>:/arr-share:rw"
      - "<NAS_MOUNT> Shows:/Cold_Store/big_store/TV Shows:rw"
      - "<NAS_MOUNT>:/Cold_Store/big_store/Anime:rw"
      - "<NAS_MOUNT>:/Cold_Store/big_store/Movies:rw"
      - "<NAS_MOUNT>:/Common/Windows/Music:rw"
    ports:
      - 6767:6767
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.<HOST>.example.org`) || Host(`bazarr.<HOST>.example.org`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    networks:
      proxy:
      servarrnetwork:
        ipv4_address: 172.39.0.6

networks:
  servarrnetwork:
    name: servarrnetwork
    ipam:
      config:
        - subnet: 172.39.0.0/24
  proxy:
    external: true
