services:
  nitter:
    image: zedeus/nitter:latest
    container_name: nitter
    volumes:
      - <VOLUME>
      - <VOLUME>
    depends_on:
      - nitter-redis
    restart: unless-stopped
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:8080/Jack/status/20 || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    user: "998:998"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ports:
    #   - "127.0.0.1:8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nitter.rule=Host(`nitter.<HOST>.example.org`) || Host(`nitter.<HOST>.example.org`)"
      - "traefik.http.routers.nitter.entrypoints=websecure"
      - "traefik.http.routers.nitter.tls=true"
      - "traefik.http.services.nitter.loadbalancer.server.port=8080"
    networks:
      - nitter
      - proxy

  nitter-redis:
    image: redis:6-alpine
    container_name: nitter-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - <VOLUME>
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 5s
      retries: 2
    user: "999:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - nitter

networks:
  nitter:
  proxy:
    external: true
