services:
  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:3000:3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: <REDACTED>
          host: invidious-db
          port: 5432
        check_tables: true
        domain: invidious.<HOST>.example.org
        https_only: true
        external_port: 443
        use_pubsub_feeds: true
        use_innertube_for_captions: true
        invidious_companion:
          - private_url: "http://companion:8282/companion"
        invidious_companion_key: <REDACTED>
        hmac_key: <REDACTED>
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    logging:
      options:
        max-size: "1G"
        max-file: "4"
    depends_on:
      - invidious-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.invidious.rule=Host(`invidious.<HOST>.example.org`) || Host(`invidious.<HOST>.example.org`)"
      - "traefik.http.routers.invidious.entrypoints=websecure"
      - "traefik.http.routers.invidious.tls=true"
      - "traefik.http.services.invidious.loadbalancer.server.port=3000"
    networks:
      - invidious
      - proxy

  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      - SERVER_SECRET_KEY=<REDACTED>
    # ports:
    #   - "127.0.0.1:8282:8282"
    logging:
      options:
        max-size: "1G"
        max-file: "4"
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - <VOLUME>
    security_opt:
      - no-new-privileges:true
    networks:
      - invidious

  invidious-db:
    image: postgres:14
    restart: unless-stopped
    volumes:
      - <VOLUME>
      - <VOLUME>
      - <VOLUME>
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: <REDACTED>
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    networks:
      - invidious

networks:
  invidious:
  proxy:
    external: true
