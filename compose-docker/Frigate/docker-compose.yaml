services:
  frigate:
    container_name: frigate
    # privileged: true # this may not be necessary for all setups
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    devices:
      #- /dev/bus/usb:/dev/bus/usb
      - /dev/apex_0:/dev/apex_0
      - /dev/apex_1:/dev/apex_1
      #- /dev/dri/renderD128:/dev/dri/renderD128 # for intel hwaccel, needs to be updated for your hardware
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - <VOLUME>
      - <VOLUME>
      - <VOLUME>
      - <VOLUME>
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 2000000000
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:1935:1935" # RTMP feeds (deprecated)
      - "127.0.0.1:8554:8554" # RTSP feeds
    environment:
      FRIGATE_RTSP_PASSWORD: <REDACTED>
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frigate.rule=Host(`frigate.<HOST>.example.org`) || Host(`frigate.<HOST>.example.org`)"
      - "traefik.http.routers.frigate.entrypoints=websecure"
      - "traefik.http.routers.frigate.tls=true"
      - "traefik.http.services.frigate.loadbalancer.server.port=5000"
    networks:
      - proxy

networks:
  proxy:
    external: true
