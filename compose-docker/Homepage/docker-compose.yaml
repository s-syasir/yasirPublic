services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - <VOLUME>
      - <VOLUME>
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    # ports:
    #   - "127.0.0.1:3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`homepage.<HOST>.example.org`) || Host(`homepage.<HOST>.example.org`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.<HOST>.example.org,homepage.<HOST>.example.org
    networks:
      - proxy

networks:
  proxy:
    external: true
