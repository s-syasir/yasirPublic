name: Local Agent
version: 1.1.0
schema: v1
models:
  - name: Qwen2.5-Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: "https://ollama.<HOST>.example.org"
    roles:
      - autocomplete
      - apply
      - chat
      - edit

  - name: Qwen2.5-Coder 1.5B --local
    provider: ollama
    model: qwen2.5-coder:1.5b
    apiBase: "http://localhost:11434"
    roles:
      - autocomplete
      - apply
      - chat
      - edit

  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed
context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase